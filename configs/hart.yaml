model:
  name: HART
  repo_path: models/HART
  checkpoint: models/HART/finetuning_HART/pretrained_checkpoint
  fine_tuning_entry_point: models/HART/finetuning_HART/finetune.py
  checkpoint_input_channels: 1

input:
  channels:
    - accel_x
    - accel_y
    - accel_z
    - gyro_x
    - gyro_y
    - gyro_z
  channel_order_and_multichannel_transfer: TODO

preprocessing:
  target_sampling_rate_hz: 30
  sequence_length_samples: 120
  window_seconds: 4

training:
  device: auto
  batch_size: 32
  learning_rate: 0.0001
  epochs: 30
